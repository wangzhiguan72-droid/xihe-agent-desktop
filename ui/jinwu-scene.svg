<svg xmlns="http://www.w3.org/2000/svg" id="jinwuMotionScene" class="jinwu-scene" viewBox="0 0 960 540" overflow="visible" role="img" aria-labelledby="title desc">
  <title id="title">金乌自扶桑振翅而起</title>
  <desc id="desc">汤谷扶桑，九日居下枝，一日居上枝。日金焰羽的三足神乌立于扶桑，振翅而起，飞入日中</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#0e1326"/><stop offset=".42" stop-color="#3a2340"/><stop offset=".76" stop-color="#b0533a"/><stop offset="1" stop-color="#f0a64c"/></linearGradient>
    <radialGradient id="sunGlow"><stop stop-color="#fff6d2" stop-opacity=".95"/><stop offset=".2" stop-color="#ffd98a" stop-opacity=".55"/><stop offset=".55" stop-color="#f29a45" stop-opacity=".2"/><stop offset="1" stop-color="#e0703a" stop-opacity="0"/></radialGradient>
    <radialGradient id="sunDisk"><stop offset=".7" stop-color="#fffaf0"/><stop offset=".92" stop-color="#ffe7a8"/><stop offset="1" stop-color="#ffc874" stop-opacity="0"/></radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#c9773c"/><stop offset=".35" stop-color="#7a3f2a"/><stop offset=".8" stop-color="#2e1a1e"/><stop offset="1" stop-color="#160f14"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3d6a4f"/><stop offset=".6" stop-color="#1c3330"/><stop offset="1" stop-color="#0f1c1d"/></linearGradient>
    <radialGradient id="bloom"><stop stop-color="#fff1a0"/><stop offset=".25" stop-color="#ff7a2a"/><stop offset=".7" stop-color="#d0191f"/><stop offset="1" stop-color="#7a0b16"/></radialGradient>
    <radialGradient id="miniSun"><stop stop-color="#fff6c8"/><stop offset=".45" stop-color="#ffc04a" stop-opacity=".8"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
    <linearGradient id="cloud" x2="0" y2="1"><stop stop-color="#f1c48e" stop-opacity=".55"/><stop offset="1" stop-color="#8a5a52" stop-opacity="0"/></linearGradient>
    <linearGradient id="torsoGrad" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#b8561a"/><stop offset=".4" stop-color="#f2a632"/><stop offset=".8" stop-color="#ffd770"/><stop offset="1" stop-color="#fff0b0"/></linearGradient>
    <linearGradient id="chestGrad" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#fffaf0"/><stop offset=".6" stop-color="#ffe2b0"/><stop offset="1" stop-color="#ffab5c"/></linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#fffbe0"/><stop offset=".35" stop-color="#ffe27a"/><stop offset=".75" stop-color="#f5b03a"/><stop offset="1" stop-color="#d06a1a"/></linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a8"/><stop offset=".5" stop-color="#f2b640"/><stop offset="1" stop-color="#a8641a"/></linearGradient>
    <radialGradient id="iris"><stop stop-color="#fffbe0"/><stop offset=".4" stop-color="#ffd23a"/><stop offset=".8" stop-color="#ff7a10"/><stop offset="1" stop-color="#8a2a08"/></radialGradient>
    <radialGradient id="orb"><stop stop-color="#fffbe6"/><stop offset=".3" stop-color="#ffe066"/><stop offset=".65" stop-color="#ff7a1a" stop-opacity=".85"/><stop offset="1" stop-color="#e0301a" stop-opacity="0"/></radialGradient>
    <radialGradient id="ember"><stop stop-color="#fff6c0"/><stop offset=".4" stop-color="#ffb02e"/><stop offset="1" stop-color="#ff5a14" stop-opacity="0"/></radialGradient>
    <radialGradient id="flameWing" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="220"><stop stop-color="#b02a12"/><stop offset=".3" stop-color="#e8501c"/><stop offset=".5" stop-color="#ff8a24"/><stop offset=".7" stop-color="#ffc040"/><stop offset=".88" stop-color="#ffe88a"/><stop offset="1" stop-color="#fffdf0"/></radialGradient>
    <radialGradient id="flameTail" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="150"><stop stop-color="#d84a18"/><stop offset=".35" stop-color="#ff8a24"/><stop offset=".7" stop-color="#ffc844"/><stop offset="1" stop-color="#fff4c0"/></radialGradient>
    <radialGradient id="flameRibbon" gradientUnits="userSpaceOnUse" cx="-74" cy="26" r="320"><stop stop-color="#fff0a0"/><stop offset=".25" stop-color="#ffc23a"/><stop offset=".6" stop-color="#f07a1e"/><stop offset=".85" stop-color="#c8401a"/><stop offset="1" stop-color="#ffb04a"/></radialGradient>
    <radialGradient id="flameDeep" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="230"><stop stop-color="#3a0610"/><stop offset=".3" stop-color="#6e0e16"/><stop offset=".6" stop-color="#a01c1a"/><stop offset=".85" stop-color="#c8401e"/><stop offset="1" stop-color="#e06a2a"/></radialGradient>
    <radialGradient id="covertMid" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="170"><stop stop-color="#8a1216"/><stop offset=".45" stop-color="#c8281c"/><stop offset="1" stop-color="#f05a24"/></radialGradient>
    <radialGradient id="covertGold" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="170"><stop stop-color="#e8901e"/><stop offset=".5" stop-color="#ffbc2e"/><stop offset="1" stop-color="#ffdc60"/></radialGradient>
    <radialGradient id="covertPale" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="170"><stop stop-color="#fff0c0"/><stop offset=".6" stop-color="#fff8e0"/><stop offset="1" stop-color="#ffffff"/></radialGradient>
    <linearGradient id="scaleGrad" x1="1" y1="0" x2="0" y2="0"><stop stop-color="#e8892a"/><stop offset=".55" stop-color="#ffc24e"/><stop offset="1" stop-color="#fff0b8"/></linearGradient>
    <clipPath id="torsoClip"><path d="M40-38C58-20 60 15 38 40 20 58-20 58-45 45-60 38-75 30-84 24-62 8-36-18-10-30 5-38 25-44 40-38Z"/></clipPath>
    <linearGradient id="streamer" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7d8cff"/><stop offset=".6" stop-color="#3a56d8"/><stop offset="1" stop-color="#9a5cff" stop-opacity=".3"/></linearGradient>
    <radialGradient id="auraGlow"><stop stop-color="#fffbe6" stop-opacity=".95"/><stop offset=".22" stop-color="#ffe27a" stop-opacity=".7"/><stop offset=".5" stop-color="#ffa53a" stop-opacity=".32"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
    <radialGradient id="ray" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="250"><stop offset=".38" stop-color="#fff8d0" stop-opacity=".95"/><stop offset=".6" stop-color="#ffcf55" stop-opacity=".7"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx=".5" cy=".47" r=".6"><stop offset=".64" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="fadeEdges" maskUnits="userSpaceOnUse" x="0" y="0" width="960" height="540"><rect width="960" height="540" fill="url(#vig)"/></mask>
    <filter id="birdGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 .25  0 .55 0 0 .06  0 0 .15 0 0  0 0 0 .75 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <style>
    .jinwu-scene .rays{transform-origin:700px 165px;animation:xh-rays 5.3s ease-out both}
    .jinwu-scene .sun-glow{transform-origin:700px 165px;animation:xh-sun 5.3s ease-in-out both}
    .jinwu-scene .cloud-far{animation:xh-cloud-far 5.3s ease-out both}
    .jinwu-scene .cloud-near{animation:xh-cloud-near 5.3s ease-out both}
    .jinwu-scene .leaves{transform-origin:150px 300px;animation:xh-leaves 5.3s ease-in-out both}
    @keyframes xh-rays{0%{opacity:0;transform:rotate(-6deg) scale(.7)}60%{opacity:.5}100%{opacity:.75;transform:rotate(4deg) scale(1.05)}}
    @keyframes xh-sun{0%{opacity:.55;transform:scale(.8)}100%{opacity:1;transform:scale(1.12)}}
    @keyframes xh-cloud-far{from{transform:translateX(-24px);opacity:.3}to{transform:translateX(14px);opacity:1}}
    @keyframes xh-cloud-near{from{transform:translateX(36px);opacity:.3}to{transform:translateX(-30px);opacity:1}}
    @keyframes xh-leaves{0%,100%{transform:rotate(0)}30%{transform:rotate(-1.2deg)}65%{transform:rotate(1deg)}}
    @media(prefers-reduced-motion:reduce){.jinwu-scene *{animation:none!important}}
  </style>
